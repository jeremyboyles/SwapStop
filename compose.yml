services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: swapstop-backend
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: "super-secret-key-change-this"
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
    networks:
      - swapnet

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: swapstop-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - swapnet

networks:
  swapnet:
    driver: bridge
